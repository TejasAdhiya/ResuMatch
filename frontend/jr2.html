<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResuMatch - Find Candidates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: darkgoldenrod;
      --primary-dark: #b8860b;
      --primary-light: #ffd700;
      --accent: #ffc125;
      --bg: #1a1a1a;
      --card: #2d2d2d;
      --text: #f0f0f0;
      --text-light: #b0b0b0;
      --border: #444444;
      --success: #4cc9f0;
      --error: #ef233c;
      --matched-color: #50C878;
      --missing-color: #FF6B6B;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      scroll-behavior: smooth;
    }
    body {
      opacity: 0;
      animation: fadeIn 1s ease-in forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.2;
      min-height: 100vh;
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }
    
    .logo-container {
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 100;
      cursor: pointer;
    }
    
    .logo-img {
      height: 200px;
      width: auto;
      position: relative;
      z-index: 101;
      transition: all 0.5s ease;
    }
    
    .glitter-particle {
      position: absolute;
      background: var(--primary-light);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99;
      opacity: 0;
    }
    
    @keyframes glitterFall {
      0% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--glitter-x, 100px), var(--glitter-y, 500px)) rotate(360deg);
        opacity: 0;
      }
    }
    
    .logo-container:hover .logo-img {
      filter: drop-shadow(0 0 10px var(--primary-light));
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
      padding-top: 60px;
    }
    
    h1 {
      color: var(--primary-light);
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }
    
    .tagline {
      font-size: 1.2rem;
      color: var(--text);
      max-width: 600px;
      margin: 0 auto;
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      padding: 40px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
    }
    
    .form-group {
      margin-bottom: 25px;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--text);
      font-size: 1.1rem;
    }
    
    .textarea-container {
      height: 180px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #3a3a3a;
    }
    
    #jobDescription {
      width: 100%;
      height: 100%;
      padding: 15px;
      font-size: 1rem;
      background: #3a3a3a;
      color: var(--text);
      border: none;
      resize: none;
      overflow-y: auto;
      box-sizing: border-box;
    }
    
    input:focus, #jobDescription:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.2);
    }
        .form-group {
      margin-bottom: 20px;
    }
        textarea, select {
      width: 100%;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 1rem;
      color: var(--text);
      font-family: inherit;
    }
      textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 5px var(--primary-light);
    }
      select {
      appearance: none;
      background-image: url('data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"%3E%3Cpolygon points="0,0 20,0 10,10" fill="%23f0f0f0"/%3E%3C/svg%3E');
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 12px;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      width: 100%;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
    }
    
    button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(184, 134, 11, 0.3);
    }
    
    button:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    #result {
      display: none;
    }
    
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }
    
    .spinner {
      border: 4px solid rgba(184, 134, 11, 0.1);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #jobDescription::-webkit-scrollbar {
      width: 8px;
    }
    
    #jobDescription::-webkit-scrollbar-track {
      background: #3a3a3a;
    }
    
    #jobDescription::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }
    
    #jobDescription::-webkit-scrollbar-thumb:hover {
      background: var(--primary-dark);
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 100px 15px 30px;
      }
      
      .logo-img {
        height: 150px;
      }
      
      h1 {
        font-size: 2.2rem;
      }
      
      .card {
        padding: 25px;
      }
    }
  </style>
</head>
<body>
  <div class="logo-container" id="logoContainer">
    <img src="logo.png" alt="ResuMatch Logo" class="logo-img">
  </div>

  <div class="container">
    <header>
      <h1>ResuMatch</h1>
      <p class="tagline">AI-powered recruitment optimization for your hiring needs</p>
    </header>
    
    <div class="card">
      <form id="jobDescForm">
        <div class="form-group">
          <label for="jobDescription">Enter Job Description</label>
          <div class="textarea-container">
            <textarea id="jobDescription" name="job_description" placeholder="Enter the job description to find qualified candidates..." required></textarea>
          </div>
        </div>
        
          <div class="form-group">
          <label for="stateSelection">Select State</label>
          <select id="stateSelection" name="state" placeholder="Select a state in which your company is located" required>
            <option value="" disabled selected>Select a state in which your company is located</option>
            <option value="Andhra Pradesh">Andhra Pradesh</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Bihar">Bihar</option>
            <option value="Chhattisgarh">Chhattisgarh</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Haryana">Haryana</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Kerala">Kerala</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Odisha">Odisha</option>
            <option value="Punjab">Punjab</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Telangana">Telangana</option>
            <option value="Tripura">Tripura</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttarakhand">Uttarakhand</option>
            <option value="West Bengal">West Bengal</option>
          </select>
        </div>
        <button type="submit" id="submitBtn">
          <span id="btnText">Find Job Seekers</span>
          <span id="btnLoader" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Searching...</span>
        </button>
      </form>
    </div>
    
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Finding candidates...</p>
    </div>
    
    <div id="result" class="card">
      <!-- Results will be populated here -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  
  <script>
    const logoContainer = document.getElementById('logoContainer');
    const colors = ['#FFD700', '#FFC125', '#FFDF00', '#FFEC8B', '#FFFACD'];
    
    function createGlitterParticle() {
      const particle = document.createElement('div');
      particle.className = 'glitter-particle';
      
      const size = Math.random() * 8 + 2;
      const duration = Math.random() * 3 + 2;
      const delay = Math.random() * 2;
      
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${Math.random() * 100}px`;
      particle.style.top = `${Math.random() * 100}px`;
      particle.style.animation = `glitterFall ${duration}s linear ${delay}s forwards`;
      particle.style.setProperty('--glitter-x', `${(Math.random() - 0.5) * 300}px`);
      particle.style.setProperty('--glitter-y', `${Math.random() * 500}px`);
      particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      
      logoContainer.appendChild(particle);
      
      setTimeout(() => {
        particle.remove();
      }, (duration + delay) * 1000);
    }
    
    function startGlitterEffect() {
      createGlitterParticle();
      if (Math.random() > 0.3) {
        setTimeout(createGlitterParticle, 100);
      }
      setTimeout(startGlitterEffect, 300);
    }
    
    window.addEventListener('load', () => {
      startGlitterEffect();
      
      logoContainer.addEventListener('mouseenter', () => {
        for (let i = 0; i < 15; i++) {
          setTimeout(createGlitterParticle, i * 50);
        }
      });
    });
  </script>
</body>
</html>
