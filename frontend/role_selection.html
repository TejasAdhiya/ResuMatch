<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResuMatch - Select Role</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #DAA520;
      --primary-dark: #B8860B;
      --primary-light: #FFD700;
      --primary-glow: rgba(218, 165, 32, 0.1);
      --bg: #0F0F0F;
      --bg-secondary: #1A1A1A;
      --text: #FFFFFF;
      --text-secondary: #E8E8E8;
      --text-muted: #888888;
      --shadow: rgba(0, 0, 0, 0.5);
      --gradient: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
      --welcome-gradient: linear-gradient(135deg, #FF6B35, #FFD700, #FF8E53);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      opacity: 0; /* Start with invisible body */
      transition: opacity 0.8s ease-in-out;
      background-image:
        radial-gradient(circle at 20% 80%, var(--primary-glow) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, var(--primary-glow) 0%, transparent 50%);
    }

    body.loaded {
      opacity: 1; /* Fade in when loaded */
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
      height: 100%;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease-out forwards;
      animation-delay: 0.3s;
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      background: var(--welcome-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease-out forwards;
      animation-delay: 0.5s;
    }

    .welcome-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease-out forwards;
      animation-delay: 0.7s;
    }

    .description {
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      max-width: 400px;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease-out forwards;
      animation-delay: 0.9s;
    }

    .options-container {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease-out forwards;
      animation-delay: 1.1s;
    }

    .option-card {
      width: 160px;
      padding: 1.5rem 1rem;
      background: var(--bg-secondary);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .option-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(218, 165, 32, 0.3);
      background: var(--primary);
      color: var(--bg);
    }

    .option-card .icon {
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
      color: var(--primary-light);
    }

    .option-card:hover .icon {
      color: var(--bg);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Loading screen */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(218, 165, 32, 0.3);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive adjustments */
    @media (min-width: 768px) {
      .logo-img {
        width: 220px;
      }
      
      .tagline {
        font-size: 2.2rem;
      }
      
      .welcome-title {
        font-size: 2.5rem;
      }
      
      .description {
        font-size: 1.1rem;
        max-width: 500px;
      }
      
      .option-card {
        width: 180px;
        padding: 2rem 1rem;
      }
    }

    @media (max-height: 700px) {
      .logo-img {
        width: 150px;
      }
      
      .tagline {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      
      .welcome-title {
        font-size: 1.5rem;
        margin-bottom: 0.8rem;
      }
      
      .description {
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        max-width: 350px;
      }
      
      .option-card {
        width: 140px;
        padding: 1.2rem 0.8rem;
        font-size: 0.9rem;
      }
      
      .option-card .icon {
        font-size: 1.5rem;
        margin-bottom: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
  </div>

  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="ResuMatch Logo" class="logo-img">
    </div>
    
    <h1 class="tagline">Unlock Your Career Potential</h1>
    
    <h2 class="welcome-title">Select Your Role</h2>
    
    <p class="description">
      Choose whether you are a job seeker looking to optimize your resume or a recruiter searching for talent.
    </p>
    
    <div class="options-container">
      <a href="job_seeker_options.html" class="option-card">
        <i class="fas fa-user-tie icon"></i>
        Job Seeker
      </a>
      <a href="job_recruiter_options.html" class="option-card">
        <i class="fas fa-briefcase icon"></i>
        Job Recruiter
      </a>
    </div>
  </div>

  <script>
    // Show loading screen first
    document.addEventListener('DOMContentLoaded', function() {
      // First fade in the body
      document.body.classList.add('loaded');
      
      // Then hide loading screen after body is visible
      setTimeout(function() {
        document.getElementById('loadingScreen').style.opacity = '0';
        setTimeout(function() {
          document.getElementById('loadingScreen').style.display = 'none';
        }, 800); // Match transition duration
      }, 300);
    });
  </script>
</body>
</html>
