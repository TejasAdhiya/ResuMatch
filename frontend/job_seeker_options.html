<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Seeker Options - ResuMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* CSS Variables */
    :root {
      --primary: #DAA520;
      --primary-dark: #B8860B;
      --primary-light: #FFD700;
      --primary-glow: rgba(218, 165, 32, 0.1);
      --bg: #0F0F0F;
      --bg-secondary: #1A1A1A;
      --text: #FFFFFF;
      --text-secondary: #E8E8E8;
      --text-muted: #888888;
      --shadow: rgba(0, 0, 0, 0.5);
      --gradient: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
      --welcome-gradient: linear-gradient(135deg, #FF6B35, #FFD700, #FF8E53);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* General Body Styles */
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto; /* Allow scrolling */
    }

    /* Particle Effect Container */
    .particle-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
    }

    .particle {
      position: absolute;
      background: var(--primary-light);
      border-radius: 50%;
      opacity: 0;
      animation: floatAndFade 15s infinite ease-in-out;
    }

    @keyframes floatAndFade {
      0% {
        transform: translateY(0) translateX(0) scale(0.5);
        opacity: 0;
      }
      25% {
        opacity: 0.3;
      }
      50% {
        transform: translateY(-100vh) translateX(50vw) scale(1);
        opacity: 0.6;
      }
      75% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-200vh) translateX(100vw) scale(0.5);
        opacity: 0;
      }
    }

    /* Container */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
      z-index: 2;
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 1s ease-out forwards 0.5s;
    }

    /* Logo Section */
    .logo-section {
      text-align: center;
      margin-bottom: 5rem; /* Increased margin */
      position: relative;
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 2.5rem; /* Increased margin */
    }

    .logo-img {
      width: 500px; /* Significantly increased logo size */
      height: auto;
      filter: drop-shadow(0 0 40px var(--primary-glow));
      animation: logoGlow 4s ease-in-out infinite alternate;
    }

    @keyframes logoGlow {
      from { filter: drop-shadow(0 0 40px var(--primary-glow)); }
      to { filter: drop-shadow(0 0 60px var(--primary-light)); }
    }

    .tagline {
      font-family: 'Poppins', sans-serif;
      font-size: 1.6rem; /* Increased text size */
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 1.2px; /* Increased letter spacing */
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 1s ease-out forwards 0.7s;
    }

    /* Main Content */
    .main-content {
      text-align: center;
      max-width: 1000px; /* Increased max width */
      width: 100%;
      margin-bottom: 5rem; /* Increased margin */
    }

    .welcome-title {
      font-family: 'Playfair Display', serif;
      font-size: 5rem; /* Increased text size */
      font-weight: 700;
      background: var(--welcome-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 3.5rem; /* Increased margin */
      line-height: 1.2;
      text-shadow: 0 0 50px rgba(255, 107, 53, 0.5);
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 1s ease-out forwards 0.9s;
    }

    .description {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem; /* Increased text size */
      color: var(--text-secondary);
      font-weight: 500;
      line-height: 1.8; /* Increased line height */
      margin-bottom: 6rem; /* Increased margin */
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 1s ease-out forwards 1.1s;
    }

    /* Options Section */
    .options-section {
      display: flex;
      flex-wrap: wrap;
      gap: 3rem; /* Increased gap */
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 800px; /* Increased max width */
    }

    .option-card {
      flex: 1;
      min-width: 320px; /* Increased min width */
      padding: 3rem 3.5rem; /* Increased padding */
      background: var(--bg-secondary);
      border: 2px solid transparent;
      border-radius: 16px;
      color: var(--text);
      font-size: 1.3rem; /* Increased text size */
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1.5px; /* Increased letter spacing */
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px var(--shadow);
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 1s ease-out forwards var(--delay);
    }

    .option-card:nth-child(1) { --delay: 1.3s; }
    .option-card:nth-child(2) { --delay: 1.5s; }

    .option-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--gradient);
      transition: left 0.4s ease;
      z-index: -1;
    }

    .option-card:hover {
      transform: translateY(-12px); /* Increased hover effect */
      border-color: var(--primary);
      box-shadow: 0 25px 45px var(--primary-glow);
      color: var(--bg);
    }

    .option-card:hover::before {
        left: 0;
    }

    .option-card .icon {
        margin-bottom: 1.2rem; /* Increased margin */
        font-size: 3rem; /* Increased icon size */
        color: var(--primary-light);
        transition: transform 0.4s ease, opacity 0.4s ease;
        opacity: 0.8;
    }

    .option-card:hover .icon {
      transform: scale(1.15); /* Increased icon hover effect */
      opacity: 1;
    }

    /* Animations */
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); } 
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .container {
        padding: 30px;
      }

      .logo-container {
        width: 120px;
        height: 120px;
      }

      .logo-img {
        width: 300px;
      }

      .tagline {
        font-size: 1.2rem;
      }

      .welcome-title {
        font-size: 3rem;
      }

      .description {
        font-size: 1rem;
      }

      .options-section {
        flex-direction: column;
        gap: 20px;
      }

      .option-card {
        width: 100%;
        min-width: unset;
        padding: 25px;
        font-size: 1.2rem;
      }

      .option-card .icon {
        font-size: 2.5rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      .logo-img {
        width: 200px;
      }

      .welcome-title {
        font-size: 2.5rem;
        width: 100%; /* Ensure it takes full width */
        text-align: center; /* Center the text content */
        /* Remove or comment out previous max-width and margin properties if they exist */
        /* max-width: 80%; */
        /* margin-left: auto; */
        /* margin-right: auto; */
        font-size: 2.5rem;
        padding-left: 2rem; /* Adjust as needed */
        padding-right: 2rem; /* Adjust as needed */
      }

      .description {
        font-size: 0.9rem;
      }

      .option-card {
        font-size: 1rem;
      }

      .option-card .icon {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="particle-container">
    <!-- Particles will be generated by JavaScript -->
  </div>

  <div class="container">
    <div class="logo-section">
      <div class="logo-container">
        <img src="logo.png" alt="ResuMatch Logo" class="logo-img">
      </div>
      <p class="tagline">Unlock Your Career Potential</p>
    </div>

    <div class="main-content"><pre>
      <h1 class="welcome-title">Choose an option below to 
get started on your
job-seeking journey</h1></pre>
      <p class="description"></p>
    </div>

    <div class="options-section">
      <a href="index.html" class="option-card">
        <i class="fas fa-file-alt icon"></i>
        Analyze My Resume
      </a>
      <a href="linkedin.html" class="option-card">
        <i class="fab fa-linkedin icon"></i>
        Fetch LinkedIn Jobs
      </a>
    </div>
  </div>

  <script>
    // Particle effect JavaScript
    const particleContainer = document.querySelector('.particle-container');
    const numParticles = 30;

    for (let i = 0; i < numParticles; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.width = `${Math.random() * 5 + 5}px`;
      particle.style.height = particle.style.width;
      particle.style.left = `${Math.random() * 100}vw`;
      particle.style.top = `${Math.random() * 100}vh`;
      particle.style.animationDelay = `${Math.random() * 10}s`;
      particleContainer.appendChild(particle);
    }

    // Slide up animation for container
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('.container');
      container.style.opacity = '1';
      container.style.transform = 'translateY(0)';
    });
  </script>
</body>
</html>
