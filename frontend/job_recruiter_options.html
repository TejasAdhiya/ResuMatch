<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Recruiter Options - ResuMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #DAA520;
      --primary-dark: #B8860B;
      --primary-light: #FFD700;
      --primary-glow: rgba(218, 165, 32, 0.1);
      --bg: #0F0F0F;
      --bg-secondary: #1A1A1A;
      --text: #FFFFFF;
      --text-secondary: #E8E8E8;
      --text-muted: #888888;
      --shadow: rgba(0, 0, 0, 0.5);
      --gradient: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
      --welcome-gradient: linear-gradient(135deg, #FF6B35, #FFD700, #FF8E53);
      --linkedin-blue: #0077B5;
    }
    

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background-image:
        radial-gradient(circle at 20% 80%, var(--primary-glow) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, var(--primary-glow) 0%, transparent 50%),
        linear-gradient(45deg, rgba(255, 215, 0, 0.05) 0%, rgba(184, 134, 11, 0.05) 100%);
      background-size: cover;
      animation: backgroundShift 25s linear infinite alternate;
    }

    @keyframes backgroundShift {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      z-index: 1;
      opacity: 0.4;
      animation: particleFlow 60s linear infinite;
    }

    @keyframes particleFlow {
      0% { background-position: 0 0; }
      100% { background-position: 300px 300px; }
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
      height: 100vh;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease-out forwards 0.5s;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-img {
      width: 240px;
      height: auto;
      filter: drop-shadow(0 0 20px var(--primary-glow));
      animation: logoGlow 4s ease-in-out infinite alternate;
    }

    @keyframes logoGlow {
      from { filter: drop-shadow(0 0 20px var(--primary-glow)); }
      to { filter: drop-shadow(0 0 30px var(--primary-light)); }
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      background: var(--welcome-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.8rem;
      text-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
    }

    .welcome-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 3rem;
      line-height: 1.5;
      max-width: 550px;
    }

    .options-section {
      display: flex;
      gap: 2.5rem;
      justify-content: center;
      width: 100%;
      max-width: 700px;
    }

    .option-card {
      flex: 1;
      min-width: 240px;
      padding: 2rem;
      background: var(--bg-secondary);
      border: 2px solid transparent;
      border-radius: 12px;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .option-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--gradient);
      transition: left 0.3s ease;
      z-index: -1;
    }

    .option-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 15px 35px rgba(218, 165, 32, 0.3);
      color: var(--bg);
    }

    .option-card:hover::before {
      left: 0;
    }

    .option-card .icon {
      font-size: 3rem;
      margin-bottom: 1.2rem;
      color: var(--primary-light);
      transition: all 0.3s ease;
    }

    .option-card:hover .icon {
      transform: scale(1.1);
      color: var(--bg);
    }

    /* Recruiter specific styling */
    .option-card.recruiter .icon {
      color: #4CAF50; /* Green color for recruiter icon */
    }

    .option-card.recruiter:hover .icon {
      color: white;
    }

    .option-card.recruiter::before {
      background: #4CAF50; /* Green gradient for recruiter option */
    }

    @media (max-width: 768px) {
      .logo-img {
        width: 220px;
      }
      
      .tagline {
        font-size: 2rem;
      }
      
      .welcome-title {
        font-size: 1.4rem;
        padding: 0 1.5rem;
      }
      
      .options-section {
        flex-direction: column;
        gap: 2rem;
      }
      
      .option-card {
        width: 100%;
        max-width: 350px;
        padding: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .logo-img {
        width: 200px;
      }
      
      .tagline {
        font-size: 1.8rem;
      }
      
      .welcome-title {
        font-size: 1.3rem;
      }
      
      .option-card {
        padding: 1.5rem;
        font-size: 1.1rem;
      }
      
      .option-card .icon {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-section">
      <img src="logo.png" alt="ResuMatch Logo" class="logo-img">
      <p class="tagline">Unlock Your Career Potential</p>
    </div>
    
    <h1 class="welcome-title">Streamline your hiring process with AI-powered recruitment solutions</h1>
    
    <div class="options-section">
      <a href="jr1.html" class="option-card">
        <i class="fas fa-file-alt icon"></i>
        Analyze Job Seekers' Resumes
      </a>
      <a href="jr2.html" class="option-card recruiter">
        <i class="fas fa-search icon"></i>
        Find Qualified Candidates
      </a>
    </div>
  </div>
</body>
</html>
