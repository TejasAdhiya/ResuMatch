<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResuMatch - Bulk Resume Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: darkgoldenrod;
      --primary-dark: #b8860b;
      --primary-light: #ffd700;
      --accent: #ffc125;
      --bg: #1a1a1a;
      --card: #2d2d2d;
      --text: #f0f0f0;
      --text-light: #b0b0b0;
      --border: #444444;
      --success: #4cc9f0;
      --error: #ef233c;
      --matched-color: #50C878;
      --missing-color: #FF6B6B;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 0;
      margin: 0;
      opacity: 0;
      animation: fadeIn 1s ease-in forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    h1 {
      color: var(--primary-light);
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }
    
    .tagline {
      font-size: 1.2rem;
      color: var(--text);
      max-width: 600px;
      margin: 0 auto;
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      padding: 40px;
      margin-bottom: 30px;
      border: 1px solid var(--border);
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: var(--text);
      font-size: 1.1rem;
    }
    
    .file-upload {
      position: relative;
      margin-bottom: 15px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: rgba(184, 134, 11, 0.05);
      transition: all 0.3s ease;
    }
    
    .file-upload:hover {
      border-color: var(--primary);
      background: rgba(184, 134, 11, 0.1);
    }
    
    .file-upload input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }
    
    .file-upload-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .file-upload-label i {
      font-size: 48px;
      color: var(--primary);
      margin-bottom: 15px;
    }
    
    .file-upload-text {
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 8px;
    }
    
    .file-upload-subtext {
      font-size: 0.9rem;
      color: var(--text-light);
    }
    
    .file-list {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }
    
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: rgba(184, 134, 11, 0.1);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .file-item:last-child {
      margin-bottom: 0;
    }
    
    .file-item i {
      color: var(--primary);
      margin-right: 10px;
    }
    
    .file-item button {
      background: var(--error);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 0.8rem;
      width: auto;
      margin: 0;
    }
    
    .file-item button:hover {
      background: #d11a32;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    input, textarea {
      width: 100%;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #3a3a3a;
      color: var(--text);
    }
    
    textarea {
      height: 150px;
      resize: vertical;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.2);
    }
    
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      width: 100%;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
    }
    
    button:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(184, 134, 11, 0.3);
    }
    
    button:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .btn-secondary {
      background: #555;
      font-size: 0.9rem;
      width: auto;
      padding: 8px 16px;
      margin: 0 5px;
    }
    
    .btn-secondary:hover:not(:disabled) {
      background: #666;
    }
    
    .btn-success {
      background: var(--success);
    }
    
    .btn-success:hover {
      background: #3fa9c9;
    }
    
    .btn-error {
      background: var(--error);
    }
    
    .btn-error:hover {
      background: #d11a32;
    }
    
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }
    
    .spinner {
      border: 4px solid rgba(184, 134, 11, 0.1);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .results-container {
      display: none;
    }
    
    .result-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .result-header h2 {
      color: var(--primary-light);
      font-size: 2rem;
      margin-bottom: 10px;
    }
    
    .result-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: rgba(184, 134, 11, 0.1);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      display: block;
    }
    
    .stat-label {
      color: var(--text-light);
      font-size: 0.9rem;
    }
    
    .candidate-card {
      background: var(--card);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      position: relative;
    }
    
    .candidate-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .candidate-info h3 {
      color: var(--primary-light);
      font-size: 1.4rem;
      margin-bottom: 5px;
    }
    
    .candidate-email {
      color: var(--text-light);
      font-size: 0.9rem;
    }
    
    .match-score {
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      background: rgba(184, 134, 11, 0.1);
      min-width: 120px;
    }
    
    .score-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      display: block;
    }
    
    .score-label {
      font-size: 0.8rem;
      color: var(--text-light);
    }
    
    .candidate-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .detail-section h4 {
      color: var(--primary);
      margin-bottom: 10px;
      font-size: 1rem;
    }
    
    .keyword-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .keyword {
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    
    .matched-keyword {
      background: rgba(80, 200, 120, 0.2);
      color: var(--matched-color);
      border: 1px solid rgba(80, 200, 120, 0.4);
    }
    
    .missing-keyword {
      background: rgba(255, 107, 107, 0.2);
      color: var(--missing-color);
      border: 1px solid rgba(255, 107, 107, 0.4);
    }
    
    .suggestion-text {
      background: rgba(184, 134, 11, 0.05);
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    
    .action-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    .action-buttons button {
      flex: 1;
      min-width: 150px;
      margin: 0;
    }
    
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
    }
    
    .modal-content {
      background-color: var(--card);
      margin: 5% auto;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      position: relative;
    }
    
    .close {
      color: var(--text-light);
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      top: 15px;
      right: 20px;
    }
    
    .close:hover {
      color: var(--text);
    }
    
    .modal h3 {
      color: var(--primary-light);
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    
    .modal .form-group {
      margin-bottom: 20px;
    }
    
    .modal input {
      margin-bottom: 10px;
    }
    
    .alert {
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      display: none;
    }
    
    .alert-success {
      background: rgba(76, 201, 240, 0.1);
      color: var(--success);
      border: 1px solid rgba(76, 201, 240, 0.3);
    }
    
    .alert-error {
      background: rgba(239, 35, 60, 0.1);
      color: var(--error);
      border: 1px solid rgba(239, 35, 60, 0.3);
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }
      
      h1 {
        font-size: 2.2rem;
      }
      
      .card {
        padding: 25px;
      }
      
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .candidate-header {
        flex-direction: column;
        align-items: stretch;
      }
      
      .candidate-details {
        grid-template-columns: 1fr;
      }
      
      .action-buttons {
        flex-direction: column;
      }
      
      .action-buttons button {
        min-width: auto;
      }
    }

    .result-card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .result-card h3 {
      color: var(--primary-light);
      margin-bottom: 10px;
    }

    .result-card .analysis {
      margin: 15px 0;
      padding: 15px;
      background: rgba(184, 134, 11, 0.1);
      border-radius: 8px;
    }

    .result-card .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .accept-btn {
      background: var(--success);
    }

    .reject-btn {
      background: var(--error);
    }

    .accept-btn:hover {
      background: #3db8e0;
    }

    .reject-btn:hover {
      background: #d61f2f;
    }

    #loading-spinner {
      display: none;
      text-align: center;
      margin: 20px 0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Bulk Resume Analysis</h1>
      <p class="tagline">Upload multiple resumes and analyze them against a job description</p>
    </header>
    
    <div class="card">
        <div class="form-group">
        <label for="resume-files">Upload Resumes (PDF only, max 10)</label>
          <div class="file-upload">
          <input type="file" id="resume-files" multiple accept=".pdf">
          <label for="resume-files" class="file-upload-label">
              <i class="fas fa-cloud-upload-alt"></i>
            <span class="file-upload-text">Click to upload resumes</span>
            <span class="file-upload-subtext">or drag and drop files here</span>
            </label>
        </div>
        <div id="file-list" class="file-list"></div>
        </div>
        
        <div class="form-group">
        <label for="job-description">Job Description</label>
        <textarea id="job-description" placeholder="Paste the job description here..."></textarea>
        </div>
        
      <button id="analyze-button">
        <i class="fas fa-search"></i>
        Analyze Resumes
        </button>
    </div>
    
    <div id="loading-spinner">
      <div class="spinner"></div>
      <p>Analyzing resumes...</p>
    </div>
    
    <div id="results-container"></div>
  </div>

  <script src="bulk_analysis.js"></script>
</body>
</html>
